<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | Emade</title>
    <!-- 파일 경로 변경 시 수정에 유의해주세요 -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variable.css" />
    <link rel="stylesheet" href="./css/signup.css" />
  </head>
  <body>
    <main class="auth">
      <a href="./index.html" class="auth__logo">Emade</a>
      <h1 class="auth__title">회원가입</h1>

      <form class="auth-form" action="index.html" method="post">
        <div class="auth-form__field">
          <input
            class="auth-form__input auth-form__input--with-btn"
            type="nickname"
            name="nickname"
            placeholder="닉네임을 입력하세요."
            required
          />
          <button type="button" class="auth-form__check">중복 확인</button>
        </div>
        <div class="auth-form__field">
          <input
            class="auth-form__input auth-form__input--with-btn"
            type="email"
            name="email"
            placeholder="이화 계정 이메일을 입력하세요."
            pattern=".+@ewha\.ac\.kr"
            required
          />
          <button type="button" class="auth-form__check">중복 확인</button>
        </div>
        <input
          class="auth-form__input"
          type="password"
          name="password"
          placeholder="비밀번호를 입력하세요."
          required
        />
        <input
          class="auth-form__input"
          type="password"
          name="passwordConfirm"
          placeholder="비밀번호를 다시 입력하세요."
          required
        />
        <p class="auth-form__error">*이미 사용 중인 아이디입니다.</p>
        <button type="submit" class="auth-form__submit">회원가입</button>
      </form>

      <p class="auth__switch">
        이미 회원이신가요?
        <a href="./login.html">로그인</a>
      </p>
    </main>
  </body>
</html>
