<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리뷰 상세 | Emade</title>
    <!-- 파일 경로 변경 시 수정에 유의해주세요 -->
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/variable.css" />
    <link rel="stylesheet" href="/default.css" />
    <link rel="stylesheet" href="/review-detail.css" />
  </head>
  <body>
    <header>
      <a href="#" class="logo">Emade</a>
      <form class="search">
        <input type="text" placeholder="상품, 태그로 검색해보세요!" />
        <button><img src="/svg/search.svg" /></button>
      </form>
      <!-- js 적용 시 로그인/로그아웃 수정. -->
      <div class="menu">
        <a href="#" class="menu_list">로그아웃</a>
        <a href="#" class="menu_list">찜</a>
        <a href="#" class="menu_list">마이페이지</a>
        <a href="#" class="menu_list">장바구니</a>
      </div>
    </header>

    <nav>
      <a href="#">전체</a>
      <a href="#">뜨개질</a>
      <a href="#">키링/액세서리</a>
      <a href="#">문구</a>
      <a href="#">수공예품</a>
      <a href="#">DIY</a>
      <a href="#">홈데코</a>
      <a href="#">랭킹</a>
      <a href="#">기타</a>
    </nav>

    <main class="review-detail">
      <a href="/review-list.html" class="back-link">
        <img src="/svg/arrow-left.svg" alt="" />
        리뷰 목록으로
      </a>

      <div class="review-detail__inner">
        <!-- ===== 사진 ===== -->
        <!-- 좌우 버튼·썸네일 클릭으로 사진 바꾸기는 JS 붙일 때 구현 -->
        <section class="gallery">
          <div class="gallery__main">
            <img src="/img/review-product-image/MainThumnail.png" alt="" />
            <button type="button" class="gallery__arrow gallery__arrow--prev">
              <img src="/svg/arrow-left.svg" alt="이전 사진" />
            </button>
            <button type="button" class="gallery__arrow gallery__arrow--next">
              <img src="/svg/arrow-right.svg" alt="다음 사진" />
            </button>
          </div>
          <ul class="gallery__thumbs">
            <li class="is-active">
              <img src="/img/review-product-image/Thumbnail2.png" alt="" />
            </li>
            <li>
              <img src="/img/review-product-image/Thumbnail3.png" alt="" />
            </li>
            <li>
              <img src="/img/review-product-image/Thumbnail4.png" alt="" />
            </li>
            <li>
              <img src="/img/review-product-image/Thumbnail5.png" alt="" />
            </li>
          </ul>
        </section>

        <!-- ===== 리뷰 내용 ===== -->
        <section class="review-content">
          <div class="review-content__top">
            <div class="review-content__rating">
              <div class="stars">
                <img src="svg/star-rate/medium_5.svg" />
              </div>
              <strong>5.0</strong>
            </div>
            <button type="button" class="helpful-btn">
              <img src="/svg/like.svg" alt="" />도움돼요 <span>10</span>
            </button>
          </div>

          <div class="review-author">
            <img class="review-author__profile" src="/svg/profile.svg" alt="" />
            <div>
              <p class="review-author__name">minji**</p>
              <p class="review-author__date">2026.10.08</p>
              <p class="review-author__option">옵션: <strong>기본</strong></p>
            </div>
          </div>

          <p class="review-content__text">
            손에 잡기 편한 디자인이라 사용하기 좋습니다.
          </p>

          <div class="seller-reply">
            <p class="seller-reply__head">
              <strong>판매자 답글</strong>
              <span>2026.10.10</span>
            </p>
            <p class="seller-reply__text">
              예쁘게 써주셔서 감사해요! 다음에도 정성껏 만들어 보내드릴게요~
            </p>
          </div>

          <a href="/product-detail.html" class="product-summary">
            <img
              class="product-summary__img"
              src="/img/review-product-image/MainThumnail.png"
              alt=""
            />
            <div class="product-summary__info">
              <p class="product-summary__name">뜨개 토마토 키링</p>
              <p class="product-summary__meta">
                12,000원
                <span class="product-summary__rating">
                  <img src="/svg/star-on.svg" alt="" />4.2 (128)
                </span>
              </p>
            </div>
            <span class="product-summary__go">상품 보러가기</span>
          </a>
        </section>
      </div>
    </main>

    <footer>
      <span class="logo">Emade</span>
      <p class="tagline">이화여자대학교 벗들의 핸드메이드 마켓</p>
      <div class="footer_link">
        <a href="#">이용약관</a> · <a href="#">개인정보처리방침</a> ·
        <a href="#">문의</a>
      </div>
    </footer>
  </body>
</html>
